<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GeoDash 2.2 Co-op Platformer</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <style>
        body {
            margin: 0;
            background-color: #0a0a0a;
            color: white;
            font-family: 'Segoe UI', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }
        
        #game-container {
            position: relative;
            box-shadow: 0 0 50px rgba(0, 255, 255, 0.1);
        }

        canvas {
            border: 3px solid #333;
            background: linear-gradient(to bottom, #1a2a6c, #b21f1f, #fdbb2d); /* Sunset Gradient */
            display: block;
        }

        /* UI Overlay */
        #ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: rgba(0, 0, 0, 0.9);
            padding: 30px;
            border-radius: 15px;
            text-align: center;
            border: 2px solid #00ffff;
            min-width: 300px;
            z-index: 10;
        }

        h1 { margin: 0 0 20px 0; font-style: italic; letter-spacing: 2px; text-shadow: 2px 2px #ff0055; }
        
        button {
            width: 100%;
            padding: 12px;
            margin: 8px 0;
            cursor: pointer;
            border: none;
            border-radius: 5px;
            font-weight: bold;
            font-size: 16px;
            text-transform: uppercase;
            transition: 0.2s;
        }

        .btn-green { background: #00ff88; color: #000; }
        .btn-blue { background: #00ffff; color: #000; }
        .btn-pink { background: #ff0055; color: #fff; }
        .btn-dark { background: #333; color: #fff; border: 1px solid #555; }
        
        button:hover { transform: scale(1.02); filter: brightness(1.2); }
        input { width: 100%; padding: 10px; box-sizing: border-box; margin-bottom: 10px; background: #222; border: 1px solid #444; color: white; text-align: center; }

        .hidden { display: none !important; }
        .id-box { font-family: monospace; background: #222; padding: 10px; color: #00ffff; border: 1px dashed #555; margin: 10px 0; user-select: text; }
        
        #hud {
            position: absolute;
            top: 10px;
            left: 10px;
            pointer-events: none;
            font-size: 14px;
            text-shadow: 1px 1px 2px black;
        }
    </style>
</head>
<body>

<div id="game-container">
    <canvas id="gameCanvas" width="960" height="540"></canvas>
    
    <div id="hud" class="hidden">
        <div>Controles: WASD ou Setas</div>
        <div id="ping-display">Modo: Local</div>
    </div>

    <div id="ui">
        <h1>NEON CO-OP</h1>
        
        <div id="main-menu">
            <button class="btn-green" onclick="startSingle()">Single Player</button>
            <div style="margin: 15px 0; border-top: 1px solid #444;"></div>
            <button class="btn-blue" onclick="setupHost()">Criar Sala (Host)</button>
            <button class="btn-pink" onclick="showJoin()">Entrar em Sala</button>
            <button class="btn-dark" onclick="toggleFullScreen()">Tela Cheia</button>
        </div>

        <div id="host-menu" class="hidden">
            <p>Seu ID de Sala:</p>
            <div id="my-id" class="id-box">Gerando...</div>
            <p>Envie para seu amigo.</p>
            <div id="host-status" style="color: yellow; margin-bottom: 10px;">Aguardando P2...</div>
            <button class="btn-dark" onclick="location.reload()">Cancelar</button>
        </div>

        <div id="join-menu" class="hidden">
            <input type="text" id="remoteId" placeholder="Cole o ID do Host aqui">
            <button class="btn-pink" onclick="joinRoom()">Conectar</button>
            <button class="btn-dark" onclick="location.reload()">Voltar</button>
        </div>
        
        <div id="game-over" class="hidden">
            <h2 style="color: #ff0055;">VOCÊ MORREU</h2>
            <p>Pressione R para reiniciar</p>
            <button class="btn-green" onclick="resetGame()">Tentar Novamente</button>
        </div>
    </div>
</div>

<script>
    // --- ENGINE E CONFIGURAÇÕES ---
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');

    // Constantes de Física (Platformer Feel)
    const GRAVITY = 0.5;
    const FRICTION = 0.8;
    const MOVE_SPEED = 0.8;
    const MAX_SPEED = 6;
    const JUMP_FORCE = -10;
    
    // Estado do Jogo
    let gameState = 'MENU'; // MENU, PLAYING, GAMEOVER
    let isMultiplayer = false;
    let isHost = false;
    let myId = 1; // 1 = Host/Single, 2 = Client
    
    // Networking
    let peer, conn;
    
    // Inputs
    const keys = {
        left: false, right: false, up: false, r: false
    };

    // Objetos
    let players = [];
    let mapBlocks = []; // Plataformas, Paredes
    let hazards = [];   // Espinhos, Serras
    let mechanics = []; // Botões, Portões
    let particles = [];
    
    let camera = { x: 0, y: 0 };

    // --- CLASSES ---

    class Player {
        constructor(id, color, startX, startY) {
            this.id = id;
            this.color = color;
            this.x = startX;
            this.y = startY;
            this.w = 30;
            this.h = 30;
            this.vx = 0;
            this.vy = 0;
            this.onGround = false;
            this.dead = false;
            this.facingRight = true;
        }

        update() {
            if (this.dead) return;

            // Física Horizontal
            this.x += this.vx;
            this.vx *= FRICTION;

            // Física Vertical
            this.y += this.vy;
            this.vy += GRAVITY;

            // Limites do Mundo (Morte se cair)
            if (this.y > 800) this.die();

            // Colisão com Blocos Sólidos
            this.onGround = false;
            mapBlocks.forEach(block => {
                const col = checkAABB(this, block);
                if (col) {
                    // Resolução de colisão simples
                    const dx = (this.x + this.w/2) - (block.x + block.w/2);
                    const dy = (this.y + this.h/2) - (block.y + block.h/2);
                    const width = (this.w + block.w) / 2;
                    const height = (this.h + block.h) / 2;
                    const crossWidth = width * dy;
                    const crossHeight = height * dx;

                    if (Math.abs(dx) <= width && Math.abs(dy) <= height) {
                        if (crossWidth > crossHeight) {
                            if (crossWidth > -crossHeight) { // Colisão em Baixo (cabeça batendo)
                                this.y = block.y + block.h;
                                this.vy = 0;
                            } else { // Colisão a Esquerda
                                this.x = block.x - this.w;
                                this.vx = 0;
                            }
                        } else {
                            if (crossWidth > -crossHeight) { // Colisão a Direita
                                this.x = block.x + block.w;
                                this.vx = 0;
                            } else { // Colisão em Cima (Chão)
                                this.y = block.y - this.h;
                                this.vy = 0;
                                this.onGround = true;
                            }
                        }
                    }
                }
            });

            // Colisão com Perigos (Serras/Espinhos)
            hazards.forEach(h => {
                if (checkCollision(this, h)) this.die();
            });

            // Colisão com Mecânicas (Portões Fechados matam se bater de frente, ou bloqueiam)
            mechanics.forEach(m => {
                if (m.type === 'gate' && m.active && checkCollision(this, m)) {
                    // Tratando portão como parede sólida
                    const dx = this.x - m.x;
                    if (Math.abs(dx) < 30) { 
                        if (this.x < m.x) this.x = m.x - this.w;
                        else this.x = m.x + m.w;
                        this.vx = 0;
                    }
                }
            });
        }

        die() {
            if (this.dead) return;
            this.dead = true;
            createExplosion(this.x, this.y, this.color);
            if (isHost || !isMultiplayer) setTimeout(triggerGameOver, 500);
        }

        draw() {
            if (this.dead) return;
            ctx.fillStyle = this.color;
            ctx.fillRect(this.x - camera.x, this.y - camera.y, this.w, this.h);
            
            // Olho (para ver direção)
            ctx.fillStyle = "white";
            let eyeX = this.facingRight ? this.x + 20 : this.x + 5;
            ctx.fillRect(eyeX - camera.x, this.y + 5 - camera.y, 8, 8);
            
            // ID
            ctx.fillStyle = "white";
            ctx.font = "10px Arial";
            ctx.fillText(`P${this.id}`, this.x - camera.x + 10, this.y - camera.y - 5);
        }
    }

    // --- SISTEMA DE MAPA ---

    function generateLevel() {
        mapBlocks = [];
        hazards = [];
        mechanics = [];
        
        // Função auxiliar para criar blocos
        const addBlock = (x, y, w, h) => mapBlocks.push({x, y, w, h, color: '#333'});
        const addSpike = (x, y) => hazards.push({x, y: y+10, w: 30, h: 20, type: 'spike'});
        const addSaw = (x, y, range) => hazards.push({x, y, w: 40, h: 40, type: 'saw', cx: x, cy: y, angle: 0, range});
        
        // CHUNK 1: Início Seguro e Pulo Básico
        addBlock(-100, 400, 600, 50); // Chão inicial
        addBlock(600, 350, 100, 20);  // Plat 1
        addBlock(800, 300, 100, 20);  // Plat 2
        
        // CHUNK 2: Introdução ao Perigo
        addBlock(1000, 400, 500, 50); // Chão 2
        addSpike(1200, 370);
        addSpike(1300, 370);
        
        // CHUNK 3: O Puzzle Co-op (Portão e Botão)
        // O botão fica em cima, o portão embaixo
        addBlock(1600, 400, 800, 50); // Chão longo
        
        // Plataforma alta para o botão
        addBlock(1700, 250, 100, 20); 
        
        // O Botão (P1 precisa subir aqui)
        mechanics.push({
            x: 1730, y: 240, w: 40, h: 10, 
            type: 'button', 
            id: 1, 
            pressed: false,
            color: '#ffd700'
        });

        // O Portão (Bloqueia o caminho embaixo)
        mechanics.push({
            x: 2000, y: 300, w: 20, h: 100,
            type: 'gate',
            linkId: 1, // Linkado ao botão 1
            active: true, // Começa fechado
            color: '#00ffff'
        });

        // Serra Móvel depois do portão
        addSaw(2200, 360, 100);

        // CHUNK 4: Parkour Conjunto
        addBlock(2500, 400, 200, 50);
        addBlock(2800, 300, 50, 200); // Parede para pular
        addBlock(3000, 400, 500, 50);
        
        // Final
        addBlock(3600, 400, 200, 50);
        // Bandeira/Fim (Simulado por um bloco verde)
        mapBlocks.push({x: 3700, y: 300, w: 20, h: 100, color: '#00ff00', win: true});
    }

    // --- GAME LOOP ---

    function initGame() {
        players = [
            new Player(1, '#00ffff', 50, 300),
            new Player(2, '#ff0055', 100, 300)
        ];
        
        if (!isMultiplayer) {
            // No single player, o Player 2 fica "dormindo" ou é removido, 
            // mas para testar as mecânicas de botão, vou deixar ele controlável 
            // com teclas diferentes ou simplesmente remove-lo e mudar o mapa.
            // Para simplificar: Singleplayer joga sozinho, botão é "toggle" (aperta e fica).
            players.pop(); 
        }

        generateLevel();
        gameState = 'PLAYING';
        document.getElementById('ui').classList.add('hidden');
        document.getElementById('hud').classList.remove('hidden');
        requestAnimationFrame(loop);
    }

    function loop() {
        if (gameState !== 'PLAYING') return;

        ctx.clearRect(0, 0, canvas.width, canvas.height);

        // 1. Processar Inputs (Host ou Local)
        processInputs();

        // 2. Física e Lógica (Apenas HOST roda lógica pesada)
        if (isHost || !isMultiplayer) {
            updatePhysics();
            updateMechanics();
            broadcastState();
        }

        // 3. Atualizar Câmera (Interpolação para suavidade)
        // Câmera segue o ponto médio entre os jogadores vivos
        let targetX = 0, targetY = 0, count = 0;
        players.forEach(p => {
            if (!p.dead) {
                targetX += p.x;
                targetY += p.y;
                count++;
            }
        });
        if (count > 0) {
            targetX /= count;
            targetY /= count;
            // Centraliza
            targetX -= canvas.width / 2;
            targetY -= canvas.height / 2;
        }
        // Smooth camera
        camera.x += (targetX - camera.x) * 0.1;
        // Clamp Y (não deixa câmera subir/descer demais)
        camera.y = Math.max(0, Math.min(targetY, 200)); 

        // 4. Renderizar
        drawWorld();

        requestAnimationFrame(loop);
    }

    function processInputs() {
        // Se Single ou Host: Aplica input direto no P1
        // Se Client: Envia input para Host, Host aplica no P2
        
        let activePlayer = (myId === 1) ? players[0] : players[1];
        if (!activePlayer || activePlayer.dead) return;

        // Movimento Horizontal
        if (keys.left) { activePlayer.vx -= MOVE_SPEED; activePlayer.facingRight = false; }
        if (keys.right) { activePlayer.vx += MOVE_SPEED; activePlayer.facingRight = true; }
        
        // Limite de Velocidade
        if (activePlayer.vx > MAX_SPEED) activePlayer.vx = MAX_SPEED;
        if (activePlayer.vx < -MAX_SPEED) activePlayer.vx = -MAX_SPEED;

        // Pulo
        if (keys.up && activePlayer.onGround) {
            activePlayer.vy = JUMP_FORCE;
            activePlayer.onGround = false;
        }

        // Enviar input via rede se for cliente
        if (isMultiplayer && !isHost) {
            conn.send({ type: 'INPUT', keys: keys });
        }
    }

    function updatePhysics() {
        players.forEach(p => p.update());
        
        // Atualizar Serras Móveis
        hazards.forEach(h => {
            if (h.type === 'saw') {
                h.angle += 0.2;
                // Movimento de vai e vem
                h.x = h.cx + Math.sin(Date.now() / 500) * h.range;
            }
        });
    }

    function updateMechanics() {
        // Lógica dos Botões e Portões
        mechanics.forEach(mech => {
            if (mech.type === 'button') {
                let pressed = false;
                // Verifica se ALGUM player está em cima do botão
                players.forEach(p => {
                    if (!p.dead && checkAABB(p, mech)) pressed = true;
                });
                
                // No singleplayer, botão é "sticky" (aperta uma vez e fica)
                if (!isMultiplayer && pressed) mech.pressed = true;
                else if (isMultiplayer) mech.pressed = pressed; // No multi precisa segurar
            }
            
            if (mech.type === 'gate') {
                // Acha o botão correspondente
                const btn = mechanics.find(m => m.type === 'button' && m.id === mech.linkId);
                if (btn) {
                    mech.active = !btn.pressed; // Se botão pressionado, portão desativa (abre)
                }
            }
        });
    }

    function drawWorld() {
        // Fundo Parallax simples
        ctx.save();
        ctx.fillStyle = "rgba(255,255,255,0.05)";
        for(let i=0; i<10; i++) ctx.fillRect((i*200 - camera.x*0.5)%1000, 100, 50, 500);
        ctx.restore();

        // Desenhar Blocos
        mapBlocks.forEach(b => {
            ctx.fillStyle = b.color;
            ctx.fillRect(b.x - camera.x, b.y - camera.y, b.w, b.h);
            // Borda Neon
            ctx.strokeStyle = "#444";
            ctx.strokeRect(b.x - camera.x, b.y - camera.y, b.w, b.h);
        });

        // Desenhar Mecânicas (Botões/Portões)
        mechanics.forEach(m => {
            if (m.type === 'button') {
                ctx.fillStyle = m.pressed ? '#555' : m.color;
                let h = m.pressed ? m.h / 2 : m.h; // Esmaga visualmente
                let y = m.pressed ? m.y + m.h/2 : m.y;
                ctx.fillRect(m.x - camera.x, y - camera.y, m.w, h);
            } else if (m.type === 'gate') {
                if (m.active) {
                    ctx.fillStyle = m.color;
                    ctx.fillRect(m.x - camera.x, m.y - camera.y, m.w, m.h);
                    // Brilho no portão
                    ctx.shadowColor = m.color;
                    ctx.shadowBlur = 10;
                    ctx.fillRect(m.x - camera.x + 5, m.y - camera.y + 5, m.w-10, m.h-10);
                    ctx.shadowBlur = 0;
                } else {
                    // Portão aberto (fantasma)
                    ctx.strokeStyle = "rgba(0, 255, 255, 0.2)";
                    ctx.strokeRect(m.x - camera.x, m.y - camera.y, m.w, m.h);
                }
            }
        });

        // Desenhar Perigos
        hazards.forEach(h => {
            if (h.type === 'spike') {
                ctx.fillStyle = "red";
                ctx.beginPath();
                ctx.moveTo(h.x - camera.x, h.y + h.h - camera.y);
                ctx.lineTo(h.x + h.w/2 - camera.x, h.y - camera.y);
                ctx.lineTo(h.x + h.w - camera.x, h.y + h.h - camera.y);
                ctx.fill();
            } else if (h.type === 'saw') {
                ctx.save();
                ctx.translate(h.x + h.w/2 - camera.x, h.y + h.h/2 - camera.y);
                ctx.rotate(h.angle);
                ctx.fillStyle = "#aaa";
                ctx.beginPath();
                ctx.arc(0, 0, 20, 0, Math.PI*2);
                ctx.fill();
                ctx.fillStyle = "red"; // Dentes da serra
                for(let i=0; i<8; i++) {
                    ctx.rotate(Math.PI/4);
                    ctx.fillRect(15, -5, 10, 10);
                }
                ctx.restore();
            }
        });

        // Players
        players.forEach(p => p.draw());

        // Partículas (Explosão)
        particles.forEach((p, index) => {
            p.x += p.vx;
            p.y += p.vy;
            p.life--;
            ctx.fillStyle = p.color;
            ctx.fillRect(p.x - camera.x, p.y - camera.y, p.size, p.size);
            if(p.life <= 0) particles.splice(index, 1);
        });
    }

    // --- UTILITÁRIOS ---

    function checkCollision(player, obj) {
        return (player.x < obj.x + obj.w &&
                player.x + player.w > obj.x &&
                player.y < obj.y + obj.h &&
                player.y + player.h > obj.y);
    }
    
    // AABB (Axis-Aligned Bounding Box) Genérico
    function checkAABB(rect1, rect2) {
        return (rect1.x < rect2.x + rect2.w &&
                rect1.x + rect1.w > rect2.x &&
                rect1.y < rect2.y + rect2.h &&
                rect1.y + rect1.h > rect2.y);
    }

    function createExplosion(x, y, color) {
        for(let i=0; i<20; i++) {
            particles.push({
                x: x + 15, y: y + 15,
                vx: (Math.random() - 0.5) * 10,
                vy: (Math.random() - 0.5) * 10,
                life: 30,
                color: color,
                size: Math.random() * 5 + 2
            });
        }
    }

    function triggerGameOver() {
        if (gameState === 'GAMEOVER') return;
        gameState = 'GAMEOVER';
        document.getElementById('ui').classList.remove('hidden');
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('game-over').classList.remove('hidden');
        
        if (isHost && isMultiplayer) conn.send({ type: 'GAMEOVER' });
    }
    
    function resetGame() {
        // Envia reset para client
        if (isHost && isMultiplayer) conn.send({ type: 'RESET' });
        initGame();
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen();
        } else {
            if (document.exitFullscreen) document.exitFullscreen();
        }
    }

    // --- CONTROLE DE INPUTS ---
    window.addEventListener('keydown', e => {
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = true;
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = true;
        if (e.key === 'ArrowUp' || e.key === 'w' || e.code === 'Space') keys.up = true;
        if (e.key.toLowerCase() === 'r' && gameState === 'GAMEOVER') resetGame();
    });

    window.addEventListener('keyup', e => {
        if (e.key === 'ArrowLeft' || e.key === 'a') keys.left = false;
        if (e.key === 'ArrowRight' || e.key === 'd') keys.right = false;
        if (e.key === 'ArrowUp' || e.key === 'w' || e.code === 'Space') keys.up = false;
    });

    // --- MULTIPLAYER P2P (PEERJS) ---

    function startSingle() {
        isMultiplayer = false;
        isHost = true;
        initGame();
    }

    function setupHost() {
        peer = new Peer();
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('host-menu').classList.remove('hidden');
        
        peer.on('open', id => {
            document.getElementById('my-id').innerText = id;
            isHost = true;
            myId = 1;
        });

        peer.on('connection', c => {
            conn = c;
            setupConn();
            document.getElementById('host-status').innerText = "JOGADOR 2 CONECTADO! INICIANDO...";
            document.getElementById('host-status').style.color = "#00ff00";
            isMultiplayer = true;
            setTimeout(initGame, 1000);
        });
    }

    function showJoin() {
        document.getElementById('main-menu').classList.add('hidden');
        document.getElementById('join-menu').classList.remove('hidden');
    }

    function joinRoom() {
        const destId = document.getElementById('remoteId').value;
        peer = new Peer();
        peer.on('open', id => {
            conn = peer.connect(destId);
            setupConn();
            isHost = false;
            myId = 2;
        });
    }

    function setupConn() {
        conn.on('data', data => {
            // CLIENT LÓGICA
            if (!isHost) {
                if (data.type === 'UPDATE') {
                    // Sincroniza posições
                    players[0].x = data.p1.x; players[0].y = data.p1.y; players[0].dead = data.p1.dead;
                    players[1].x = data.p2.x; players[1].y = data.p2.y; players[1].dead = data.p2.dead;
                    // Sincroniza Mecânicas
                    mechanics.forEach((m, i) => {
                        if (data.mechs[i]) {
                            m.active = data.mechs[i].a;
                            m.pressed = data.mechs[i].p;
                        }
                    });
                    // Sincroniza Perigos Móveis
                    hazards.forEach((h, i) => {
                       if (h.type === 'saw' && data.hazz[i]) {
                           h.x = data.hazz[i].x;
                           h.angle = data.hazz[i].a;
                       } 
                    });
                    
                    if (gameState === 'MENU') {
                        document.getElementById('ui').classList.add('hidden');
                        document.getElementById('hud').classList.remove('hidden');
                        generateLevel(); // Gera mapa localmente para renderizar
                        gameState = 'PLAYING';
                        requestAnimationFrame(loop);
                    }
                }
                if (data.type === 'GAMEOVER') triggerGameOver();
                if (data.type === 'RESET') initGame();
            }
            
            // HOST LÓGICA (Recebendo input do P2)
            if (isHost && data.type === 'INPUT') {
                // Atualiza o estado das teclas virtuais do P2
                // Note: Precisaríamos guardar o estado das teclas do P2 separadamente
                // Hack rápido: vamos aplicar velocidade direta baseada no input remoto
                const p2 = players[1];
                if (!p2.dead) {
                    if (data.keys.left) { p2.vx -= MOVE_SPEED; p2.facingRight = false; }
                    if (data.keys.right) { p2.vx += MOVE_SPEED; p2.facingRight = true; }
                    if (data.keys.up && p2.onGround) { p2.vy = JUMP_FORCE; p2.onGround = false; }
                }
            }
        });
    }

    function broadcastState() {
        if (!conn) return;
        
        // Host envia o estado do mundo para o client
        // Otimização: Enviamos arrays simplificados
        const mechState = mechanics.map(m => ({ a: m.active, p: m.pressed }));
        const hazzState = hazards.map(h => h.type === 'saw' ? { x: h.x, a: h.angle } : null);

        conn.send({
            type: 'UPDATE',
            p1: { x: players[0].x, y: players[0].y, dead: players[0].dead },
            p2: { x: players[1].x, y: players[1].y, dead: players[1].dead },
            mechs: mechState,
            hazz: hazzState
        });
    }

</script>
